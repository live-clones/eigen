# Base configuration for windows builds.
# SPDX-FileCopyrightText: The Eigen Authors
# SPDX-License-Identifier: MPL-2.0
.build:windows:
  needs: []
  extends: .common:windows
  stage: build
  variables:
    EIGEN_CI_BUILD_TARGET: buildtests
    # Reduce overall build size and compile time.
    # Note: /d2ReducedOptimizeHugeFunctions is only available in VS 2019.
    EIGEN_CI_TEST_CUSTOM_CXX_FLAGS: "/d2ReducedOptimizeHugeFunctions;/DEIGEN_STRONG_INLINE=inline;/Os"
    # "off" disables the ccache compiler launchers (see
    # build.windows.script.ps1); used where the dominant compiles bypass them
    # (nvcc-driven .cu files). The script downloads a pinned,
    # SHA-256-verified ccache when the runner has none; if that also fails,
    # the job builds exactly as before.
    EIGEN_CI_CCACHE: "on"
    CCACHE_DIR: ${CI_PROJECT_DIR}/.ccache
    CCACHE_MAXSIZE: 2G
    # Hash compile paths relative to the project directory: absolute paths are
    # part of ccache's hash, so without this a checkout-path change (runner
    # layout, concurrent build slots) turns every compile into a miss.
    CCACHE_BASEDIR: ${CI_PROJECT_DIR}
  script:
     - ./ci/scripts/build.windows.script.ps1
  tags:
    - eigen-runner
    - windows
    - x86-64
  rules: !reference [.rules:libeigen:all-tests:untrusted-cache, rules]
  # Cache the ccache directory, not ${EIGEN_CI_BUILDDIR}, mirroring
  # build.linux.gitlab-ci.yml: ccache keys on file content and compiler, so
  # hits survive a re-checkout that re-stamps every source mtime (which made
  # the old build-directory cache rebuild everything anyway).
  #
  # The pools form two disjoint trust tiers, separated by literal key
  # prefixes rather than variables or ref names: cache keys built from
  # variables are attacker-influenced (pipeline variables outrank even
  # predefined variables, and CI_COMMIT_REF_SLUG is lossy — "master_" slugs
  # to "master"), so no key an untrusted pipeline can write may ever be
  # restored by a trusted one. Untrusted pipelines (this job) use
  # "windows-ccache-scratch-*" keys: ref-scoped, self-warming across retries
  # and pushes of the same ref. Trusted pools use fully literal
  # "windows-ccache-trusted-*" keys and are written only by the :trusted
  # twin jobs below, which run in place of these jobs on scheduled/web
  # pipelines of protected refs. No variable value can make the two
  # prefixes collide, and neither tier restores the other's keys; GitLab's
  # protected/unprotected cache separation applies on top of this.
  # Writable entries push even when the build fails (when: always): the
  # retry after a compile error is exactly where hits matter most.
  cache:
    # The pinned ccache binary the build script downloads when the runner
    # has none; the script re-verifies its SHA-256 on every use, since
    # cache content is writable job output, not a trusted source.
    - key: "windows-ccache-scratch-bin-$CI_COMMIT_REF_SLUG"
      paths:
        - .ccache-bin/
      when: always
    # The ref's own compile cache, the only pool this pipeline can write.
    - key: "windows-ccache-scratch-$CI_JOB_NAME_SLUG-$CI_COMMIT_REF_SLUG"
      paths:
        - .ccache/
      when: always

######### MSVC #################################################################

# MSVC 14.29 (VS 2019) 32 bit

build:windows:x86:msvc-14.29:default:
  extends: .build:windows
  variables:
    EIGEN_CI_MSVC_ARCH: "x64_x86"

# MSVC 14.29 (VS 2019) 64 bit

build:windows:x86-64:msvc-14.29:default:
  extends: .build:windows

build:windows:x86-64:msvc-14.29:avx2:
  extends: .build:windows
  variables:
    EIGEN_CI_ADDITIONAL_ARGS: "-DEIGEN_TEST_AVX2=on"

build:windows:x86-64:msvc-14.29:avx512dq:
  extends: .build:windows
  variables:
    EIGEN_CI_ADDITIONAL_ARGS: "-DEIGEN_TEST_AVX512DQ=on"

######### Trusted-cache twins #################################################

# On scheduled/web pipelines of protected refs these run in place of the
# regular jobs above (the rule sets partition .rules:libeigen:all-tests), so
# they build the same targets and publish the same artifacts for the test
# jobs, but read and write only the fully literal "windows-ccache-trusted-*"
# keys that no variable-keyed entry can collide with. Content-keyed ccache
# tolerates several protected refs sharing a pool; CCACHE_MAXSIZE bounds it.

build:windows:x86:msvc-14.29:default:trusted:
  extends: build:windows:x86:msvc-14.29:default
  rules: !reference [.rules:libeigen:all-tests:trusted-cache, rules]
  cache:
    - key: "windows-ccache-trusted-bin"
      paths:
        - .ccache-bin/
      when: always
    - key: "windows-ccache-trusted-msvc14-29-x86"
      paths:
        - .ccache/
      when: always

build:windows:x86-64:msvc-14.29:default:trusted:
  extends: build:windows:x86-64:msvc-14.29:default
  rules: !reference [.rules:libeigen:all-tests:trusted-cache, rules]
  cache:
    - key: "windows-ccache-trusted-bin"
      paths:
        - .ccache-bin/
      when: always
    - key: "windows-ccache-trusted-msvc14-29-x86-64-default"
      paths:
        - .ccache/
      when: always

build:windows:x86-64:msvc-14.29:avx2:trusted:
  extends: build:windows:x86-64:msvc-14.29:avx2
  rules: !reference [.rules:libeigen:all-tests:trusted-cache, rules]
  cache:
    - key: "windows-ccache-trusted-bin"
      paths:
        - .ccache-bin/
      when: always
    - key: "windows-ccache-trusted-msvc14-29-x86-64-avx2"
      paths:
        - .ccache/
      when: always

build:windows:x86-64:msvc-14.29:avx512dq:trusted:
  extends: build:windows:x86-64:msvc-14.29:avx512dq
  rules: !reference [.rules:libeigen:all-tests:trusted-cache, rules]
  cache:
    - key: "windows-ccache-trusted-bin"
      paths:
        - .ccache-bin/
      when: always
    - key: "windows-ccache-trusted-msvc14-29-x86-64-avx512dq"
      paths:
        - .ccache/
      when: always

# MSVC 14.29 (VS 2019) + CUDA

.build:windows:cuda:
  extends: .build:windows
  # No caching: the .cu compiles that dominate these builds go through nvcc,
  # which bypasses the C/CXX ccache launchers.
  cache: []
  variables:
    EIGEN_CI_CCACHE: "off"
    # Compute architectures present in the GitLab CI runners.
    EIGEN_CI_CUDA_COMPUTE_ARCH: "70;80"
    EIGEN_CI_BUILD_TARGET: buildtests_gpu
    EIGEN_CI_ADDITIONAL_ARGS:
      -DEIGEN_TEST_CUDA=on
      -DEIGEN_CUDA_COMPUTE_ARCH=${EIGEN_CI_CUDA_COMPUTE_ARCH}
  rules: !reference [.rules:libeigen:gpu, rules]
  tags:
    - eigen-runner
    - windows
    - x86-64
    - cuda

# MSVC 14.29 + CUDA 12.2
build:windows:x86-64:cuda-12.2:msvc-14.29:
  extends: .build:windows:cuda
  variables:
    EIGEN_CI_BEFORE_SCRIPT: $$env:CUDA_PATH=$$env:CUDA_PATH_V12_2
