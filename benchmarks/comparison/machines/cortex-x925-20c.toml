# Machine profile for the comparison harness. See CONTRACTS.md section 7.

schema_version = "1.0.0"

id = "cortex-x925-20c"
display_name = "Arm Cortex-X925 + Cortex-A725 (10+10 cores), Ubuntu 24.04"
# NOT PROBED: aarch64 Linux /proc/cpuinfo carries no "model name" line, so
# run.py falls back to this string with no provenance_gaps entry. Read off
# `lscpu` by hand. This part reports TWO model names, one per cluster; the
# profile can only carry one, and the pinning below makes it the true one.
cpu_model = "Cortex-X925"
arch = "aarch64"

locally_verified = true

isa_targets = ["aarch64-neon", "aarch64-sve"]
default_isa_target = "aarch64-neon"

sockets = 1
cores_per_socket = 20
threads_per_core = 1
smt_enabled = false
numa_nodes = 1

max_load_avg = 0.5

microarchitecture = "Arm Cortex-X925 (ARMv9.2-A) + Cortex-A725"

[memory]
benchmark_budget_bytes = 34359738368

notes = """
Heterogeneous big.LITTLE part: 10 Cortex-X925 performance cores and 10
Cortex-A725 efficiency cores, all single-threaded, sharing 24 MiB of L3 in three
8 MiB slices. `lscpu` reports two "Model name" values for this reason.

Unlike the other heterogeneous machine in this directory (apple-m4), this one
runs Linux and therefore *can* be confined to the performance cores:
[pinning].cpu_list below is the X925 cluster, so a measurement here is a
performance-core measurement rather than "whatever core the scheduler chose".
That makes it the better of the two for a published single-threaded number.

SVE2 at a 128-bit vector length (/proc/sys/abi/sve_default_vector_length is 16
bytes), plus i8mm and bf16.

No BLAS/LAPACK development package is installed and this account cannot install
one, so this profile declares NO reference arm: runs here measure the Eigen arm
only and exercise the harness's no-reference-library path. Add an [arms.*] table
once a reference library is available.
"""

[frequency]
governor = "performance"
pinned = true

[pinning]
# The X925 performance cluster. Verified against the per-CPU capacity: the big
# cores are 5-9 and 15-19, not a contiguous leading range, so "0-9" would pin to
# a mix of both clusters and produce a bimodal measurement.
tool = "taskset"
cpu_list = "5-9,15-19"
omp_proc_bind = "close"
omp_places = "cores"

[build]
generator = "Ninja"
build_type = "Release"
cxx_standard = 17

[isa."aarch64-neon"]
flags = []
cmake_options = ["-DEIGEN_BENCH_ISA_TARGET=aarch64-neon"]

[isa."aarch64-sve"]
flags = ["-march=armv9-a+sve2", "-msve-vector-bits=128", "-DEIGEN_ARM64_USE_SVE"]
cmake_options = ["-DEIGEN_BENCH_ISA_TARGET=aarch64-sve"]
