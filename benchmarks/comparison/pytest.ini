# Run with a bare `pytest` from benchmarks/comparison/.  The suite needs no
# network, no built benchmark binary and no CMake configure: every external
# input is a committed fixture under tests/fixtures/.
[pytest]
testpaths = tests
python_files = test_*.py
# -p no:cacheprovider keeps a bare `pytest` from leaving an untracked .pytest_cache
# in the source tree.
addopts = -ra --strict-markers -p no:cacheprovider
markers =
    impl: exercises one of the harness implementations (run/reduce/render/plots)
    golden: byte-compares generated output against a committed golden file
