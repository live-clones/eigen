# Base configuration for windows builds.
# SPDX-FileCopyrightText: The Eigen Authors
# SPDX-License-Identifier: MPL-2.0
.build:windows:
  needs: []
  extends: .common:windows
  stage: build
  variables:
    EIGEN_CI_BUILD_TARGET: buildtests
    # Reduce overall build size and compile time.
    # Note: /d2ReducedOptimizeHugeFunctions is only available in VS 2019.
    EIGEN_CI_TEST_CUSTOM_CXX_FLAGS: "/d2ReducedOptimizeHugeFunctions;/DEIGEN_STRONG_INLINE=inline;/Os"
  script:
     - ./ci/scripts/build.windows.script.ps1
  tags:
    - eigen-runner
    - windows
    - x86-64
  rules: !reference [.rules:libeigen:all-tests, rules]
  cache:
    key: "$CI_JOB_NAME_SLUG-$CI_COMMIT_REF_SLUG-BUILD"
    paths:
      - ${EIGEN_CI_BUILDDIR}/

######### MSVC #################################################################

# MSVC 14.29 (VS 2019) 32 bit

build:windows:x86:msvc-14.29:default:
  extends: .build:windows
  variables:
    EIGEN_CI_MSVC_ARCH: "x64_x86"

# MSVC 14.29 (VS 2019) 64 bit

build:windows:x86-64:msvc-14.29:default:
  extends: .build:windows

build:windows:x86-64:msvc-14.29:avx2:
  extends: .build:windows
  variables:
    EIGEN_CI_ADDITIONAL_ARGS: "-DEIGEN_TEST_AVX2=on"

build:windows:x86-64:msvc-14.29:avx512dq:
  extends: .build:windows
  variables:
    EIGEN_CI_ADDITIONAL_ARGS: "-DEIGEN_TEST_AVX512DQ=on"


# MSVC 14.29 (VS 2019) + CUDA

.build:windows:cuda:
  extends: .build:windows
  variables:
    # Compute architectures present in the GitLab CI runners.
    EIGEN_CI_CUDA_COMPUTE_ARCH: "70;80"
    EIGEN_CI_BUILD_TARGET: buildtests_gpu
    EIGEN_CI_ADDITIONAL_ARGS:
      -DEIGEN_TEST_CUDA=on
      -DEIGEN_CUDA_COMPUTE_ARCH=${EIGEN_CI_CUDA_COMPUTE_ARCH}
  rules: !reference [.rules:libeigen:gpu, rules]
  tags:
    - eigen-runner
    - windows
    - x86-64
    - cuda

# MSVC 14.29 + CUDA 12.2
build:windows:x86-64:cuda-12.2:msvc-14.29:
  extends: .build:windows:cuda
  variables:
    EIGEN_CI_BEFORE_SCRIPT: $$env:CUDA_PATH=$$env:CUDA_PATH_V12_2

######### MSVC cross-compiled on Linux ########################################
# Builds the Windows unit tests on a Linux runner, driving the real MSVC
# toolchain (same compiler as the native jobs) through Wine.  This gives merge
# requests MSVC coverage without occupying the Windows runners; the resulting
# binaries are run by the matching job in test.windows.gitlab-ci.yml.

.build:windows:cross:
  needs: []
  stage: build
  image: ubuntu:24.04
  variables:
    EIGEN_CI_MSVC_WINE_COMMIT: "514f8ea34842cd6d831804d0e9658d3a32870ae1"
    EIGEN_CI_MSVC_VS_MAJOR: "17"
    # Visual Studio 16.11 == MSVC 14.29 (v142), matching EIGEN_CI_MSVC_VER.
    EIGEN_CI_MSVC_VS_VERSION: "16.11"
    EIGEN_CI_TEST_CUSTOM_CXX_FLAGS: "/d2ReducedOptimizeHugeFunctions;/DEIGEN_STRONG_INLINE=inline;/Os"
    EIGEN_CI_ADDITIONAL_ARGS: ""
  before_script:
    - apt-get update -y > /dev/null
    - apt-get install -y --no-install-recommends
        ca-certificates cmake git msitools ninja-build python3 winbind wine wine64 > /dev/null
  script:
    - ./ci/scripts/build.windows-cross.script.sh
  tags:
    - saas-linux-medium-amd64
  artifacts:
    when: always
    name: "$CI_JOB_NAME_SLUG-$CI_COMMIT_REF_SLUG"
    paths:
      - ${EIGEN_CI_BUILDDIR}/
    exclude:
      # The downloaded toolchain lives in the job directory, not the build tree,
      # but exclude object files and other build scratch as the other jobs do.
      - ${EIGEN_CI_BUILDDIR}/**/*.obj
      - ${EIGEN_CI_BUILDDIR}/**/*.lib
      - ${EIGEN_CI_BUILDDIR}/**/.ninja_log
      - ${EIGEN_CI_BUILDDIR}/**/.ninja_deps
      - ${EIGEN_CI_BUILDDIR}/**/CMakeFiles/*.dir/**
      - ${EIGEN_CI_BUILDDIR}/.cmake/**
      - ${EIGEN_CI_BUILDDIR}/**/Testing/Temporary/**
    expire_in: 2 days

build:windows:cross:x86-64:msvc-14.29:smoketest:
  extends: .build:windows:cross
  variables:
    EIGEN_CI_BUILD_TARGET: buildsmoketests
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
