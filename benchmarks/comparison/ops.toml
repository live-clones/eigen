# Operation registry for the cross-library benchmark comparison harness.
#
# This file is DATA, not configuration of a build. Adding an operation, a shape
# family, a scalar variant, or a vendor arm must be an edit to this file (plus a
# benchmark source for a newly *implemented* op) and never a change to run.py,
# reduce.py, render.py, or plots.py. Consumers that cannot find a key here must
# report the row as unknown rather than inventing a default.
#
# Read benchmarks/comparison/CONTRACTS.md before editing: the `mnemonic` keys,
# the `dims` lists of the shape families, and the `scalars` tags below are the
# join key between the C++ registrations and the Python reducer.

schema_version = "1.0.0"

# The counter every comparison benchmark emits. Google Benchmark writes the raw
# rate (flops per second) into JSON; the `kIs1000` argument in the house counter
# idiom only affects console rendering. Consumers divide by 1e9 themselves.
flop_counter_name = "GFLOPS"

# ---------------------------------------------------------------------------
# Scalar variants
# ---------------------------------------------------------------------------
# The type prefix (S/D/C/Z) of a BLAS/LAPACK routine is a dimension of an
# operation, not a separate operation. `tag` is the token that appears in the
# Google Benchmark name; it is deliberately short, lowercase and free of '/' and
# ':' so it cannot be confused with a shape dimension.

[scalars.f32]
tag = "f32"
cpp = "float"
blas_prefix = "S"
is_complex = false
# Multiplier applied to an operation's real multiply-add-pair count.
flop_scale = 2.0
display = "float"

[scalars.f64]
tag = "f64"
cpp = "double"
blas_prefix = "D"
is_complex = false
flop_scale = 2.0
display = "double"

[scalars.c32]
tag = "c32"
cpp = "std::complex<float>"
blas_prefix = "C"
is_complex = true
# 4 real multiplies + 4 real adds per complex multiply-add.
flop_scale = 8.0
display = "complex<float>"

[scalars.c64]
tag = "c64"
cpp = "std::complex<double>"
blas_prefix = "Z"
is_complex = true
flop_scale = 8.0
display = "complex<double>"

# Reduced-precision types have no netlib BLAS prefix. They are listed so the
# schema does not have to change when an op gains a half-precision arm; ops opt
# in by naming the tag in their own `scalars` list.
[scalars.f16]
tag = "f16"
cpp = "Eigen::half"
blas_prefix = ""
is_complex = false
flop_scale = 2.0
display = "half"

[scalars.bf16]
tag = "bf16"
cpp = "Eigen::bfloat16"
blas_prefix = ""
is_complex = false
flop_scale = 2.0
display = "bfloat16"

# ---------------------------------------------------------------------------
# Shape families
# ---------------------------------------------------------------------------
# A shape family names its dimensions once and lists its points as groups. The
# order of `dims` is the order of the integers in each point, is the order the
# C++ side passes to `->ArgNames()`/`->Args()`, and is therefore the order the
# dimensions appear in the benchmark name. Changing it is a breaking change.
#
# Groups exist so that a partial run is expressible as data: `run.py --group`
# selects a subset, and a result file records which groups it actually covered.
# The effective grid of a family is the ordered union of its selected groups
# with duplicate points removed, first occurrence winning.

[shape_families.square3]
dims = ["m", "n", "k"]
description = "Square and rectangular level-3 shapes for C := op(A)*op(B), A is m-by-k, B is k-by-n."
default_groups = ["fixed_tiny", "small", "medium", "large", "xlarge", "legacy_square_sweep", "aliasing", "nonsquare", "tall_skinny_cache", "tall_skinny_extreme"]

[[shape_families.square3.groups]]
name = "fixed_tiny"
description = "Sizes a user would write as a fixed-size Matrix; dominated by call overhead and prologue."
points = [[2,2,2], [3,3,3], [4,4,4], [6,6,6], [8,8,8], [12,12,12], [16,16,16]]

[[shape_families.square3.groups]]
name = "small"
description = "Fits comfortably in L1/L2; micro-kernel and peeling behaviour dominate."
points = [[24,24,24], [32,32,32], [48,48,48], [64,64,64], [96,96,96], [128,128,128]]

[[shape_families.square3.groups]]
name = "medium"
description = "Blocking and packing become visible."
points = [[192,192,192], [256,256,256], [384,384,384], [512,512,512], [768,768,768], [1024,1024,1024]]

[[shape_families.square3.groups]]
name = "large"
description = "Asymptotic regime; memory bandwidth and multi-threading dominate."
points = [[1536,1536,1536], [2048,2048,2048], [3072,3072,3072], [4096,4096,4096]]

[[shape_families.square3.groups]]
name = "xlarge"
description = """
Beyond the 4096 ceiling the original grid stopped at. The upper bound is memory,
not the grid: a machine profile's [memory].benchmark_budget_bytes is enforced in
the binary before the first allocation, so a point too big for the machine is
skipped as `out_of_memory` with the footprint in the detail rather than killing
the process and losing every cell already measured in that invocation. Because
the footprint scales with sizeof(Scalar), one budget yields a different ceiling
per scalar without the grid having to know about scalars.

Run time is NOT bounded by that budget and has to be chosen. Cost grows as n^3
and again with the scalar: on any target, a complex scalar moves four times the
data of its real counterpart and pays more per element wherever the vectorized
real kernel has no complex equivalent. At the top of this group one iteration can
run to tens of seconds. Select --scalars and --groups accordingly, and use
--dry-run to see the cell count before committing to a sweep.
"""
points = [[6144,6144,6144], [8192,8192,8192], [12288,12288,12288], [16384,16384,16384]]

[[shape_families.square3.groups]]
name = "legacy_square_sweep"
description = """
Square sizes carried over verbatim from benchmarks/Core/bench_gemm.cpp that the
tiny/small/medium/large groups do not already contain. They give a finer sweep
through the region where Eigen switches blocking strategy. Do not prune without
re-measuring: the union of fixed_tiny+small+medium+large+legacy_square_sweep is
exactly the 20 square points that benchmark has always reported.
"""
points = [[160,160,160], [224,224,224], [288,288,288], [320,320,320], [448,448,448]]

[[shape_families.square3.groups]]
name = "aliasing"
description = """
Non-power-of-two and just-past-power-of-two sizes. These probe cache-set
aliasing and the remainder handling of the micro-kernel, which power-of-two
grids hide completely.
"""
points = [[100,100,100], [200,200,200], [257,257,257], [500,500,500], [1000,1000,1000], [1001,1001,1001], [4097,4097,4097]]

[[shape_families.square3.groups]]
name = "nonsquare"
description = "Rectangular shapes from benchmarks/Core/bench_gemm.cpp; each of m, n, k in turn is the long dimension."
points = [[64,64,1024], [1024,64,64], [64,1024,64], [256,256,1024], [1024,256,256]]

[[shape_families.square3.groups]]
name = "tall_skinny_cache"
description = """
Preserved verbatim from benchmarks/Core/bench_gemm.cpp. These straddle the
computeProductBlockingSizes cache threshold (k*n*sizeof(Lhs) near L1). The mc
blocking path only engages when m is large, so reaching the threshold requires
sweeping small n=k against a large m. The specific n=k values 96/128/144/160/176
were chosen to bracket that transition; replacing them with a round sweep loses
the measurement.
"""
points = [[4096,96,96], [4096,128,128], [4096,144,144], [4096,160,160], [4096,176,176], [8192,128,128]]

[[shape_families.square3.groups]]
name = "tall_skinny_extreme"
description = """
m >> n panel shapes typical of least-squares and Krylov work. n = k is an
arbitrary but deliberate choice: it keeps the family three-dimensional without
introducing a fourth free parameter, and it matches how tall_skinny_cache is
parameterised.
"""
points = [[10000,8,8], [10000,100,100], [10000,1000,1000], [10000,4000,4000]]

[shape_families.matvec2]
