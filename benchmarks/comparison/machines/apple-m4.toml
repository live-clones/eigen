# Machine profile for the comparison harness. See CONTRACTS.md section 7.
#
# Every static fact below was read off this machine with `sysctl`, `uname`,
# `sw_vers` and `c++ --version`; nothing here is estimated. `run.py` re-probes
# the facts it can and records the probed value, so a stale entry here shows up
# as a warning rather than as a wrong published number.

schema_version = "1.0.0"

id = "apple-m4"
display_name = "Apple M4 (10-core, 4P+6E), MacBook Pro"
cpu_model = "Apple M4"
arch = "arm64"

# Set once the profile has been checked against the hardware it names.
locally_verified = true

isa_targets = ["aarch64-neon", "aarch64-sme"]
default_isa_target = "aarch64-neon"

sockets = 1
cores_per_socket = 10
threads_per_core = 1
smt_enabled = false
numa_nodes = 1

# run.py refuses to measure above this 1-minute load average without
# --allow-noisy. This is an interactive laptop, so exceeding it is normal and
# the refusal is the point: a benchmark run has to be a deliberate quiet-machine
# act, not something that happens next to a build.
max_load_avg = 1.0

[memory]
# Ceiling on a single benchmark's operands, enforced in the binary before the
# first allocation (bench_compare.h). Not a machine fact -- 24 GiB is the machine
# fact -- but a budget: this is a laptop with a GUI session resident, so roughly
# 4 GiB is what a benchmark can take without the rest of the system paging.
#
# Measured, not guessed. A square double GEMM holds 3n^2 operands: at n = 12288
# that is 3.4 GiB and sustains 376 GFLOP/s, matching every smaller size; at
# n = 16384 it is 6.0 GiB and the rate collapses to 242 GFLOP/s as macOS starts
# compressing pages. The budget sits between the two.
#
# Because the footprint scales with sizeof(Scalar), one budget gives a different
# ceiling per scalar for free: at n = 12288 float needs 1.7 GiB and passes,
# complex<double> needs 6.8 GiB and is skipped as `out_of_memory`. It bounds
# memory only -- run time is bounded by choosing --scalars and --groups.
benchmark_budget_bytes = 4294967296

microarchitecture = "Apple M4 (ARMv9.2-A, 4 performance + 6 efficiency cores)"

notes = """
Heterogeneous performance/efficiency part: 4 P-cores (128 KiB L1d, 16 MiB shared
L2) and 6 E-cores (64 KiB L1d, 4 MiB shared L2). macOS provides no thread-to-core
affinity API comparable to taskset, so a run cannot be confined to the P-cores;
[pinning].tool is "none" and run.py writes a /provenance/numa/cpu_binding gap for
every run made here. Treat single-threaded numbers from this machine as "whatever
core the scheduler chose", and prefer a pinned Linux host for anything published.
24 GiB unified memory; 128-byte cache line.
"""

[frequency]
# macOS exposes no user-selectable governor or power policy to a user process.
# The empty string means "the platform has none"; run.py emits a
# /provenance/cpu/frequency_governor provenance_gaps entry for it.
governor = ""
pinned = false

[pinning]
# There is nothing to select on macOS. `unavailable_reason` is what run.py
# records in the /provenance/numa/cpu_binding gap, so a result file states the
# platform limitation rather than merely leaving the binding null.
tool = "none"
unavailable_reason = """
macOS exposes no CPU-affinity API equivalent to taskset or numactl, so the run \
could not be confined to the four performance cores of this hybrid part. Any \
thread may have been scheduled on a 4 MiB-L2 efficiency core for part of the \
run, which is the dominant uncertainty in every number measured here.\
"""

[build]
generator = "Ninja"
build_type = "Release"
cxx_standard = 17

# --------------------------------------------------------------------------
# Reference arms
# --------------------------------------------------------------------------
# Apple Accelerate is the only BLAS/LAPACK on this machine: there is no
# OpenBLAS, MKL or BLIS installation. The vendor key is all that is passed;
# comparison/vendors.cmake owns the BLA_VENDOR spelling (Apple), the cblas.h
# hints inside the framework, and the deprecation-warning suppression. Setting
# BLA_VENDOR here would pin FindBLAS's one-shot BLAS::BLAS target behind the
# table's back. Note cmake/FindAccelerate.cmake is a different module, for the
# Accelerate *sparse* backend, and is not usable for BLAS.

[arms.accelerate]
library_name = "Apple Accelerate"
cmake_options = ["-DEIGEN_BENCH_REFERENCE=accelerate"]
# Accelerate exposes no version query, so the product version is the best
# available attribution. Update it with the OS; it is what a reader has to
# defend the number against. Probed: `sw_vers` -> macOS 26.6.2, build 25G83.
version_fallback = "Apple Accelerate, macOS 26.6.2 (build 25G83)"
threading_model = "gcd"
interface = "lp64"
provides = ["blas", "cblas", "lapack"]
# Accelerate reads VECLIB_MAXIMUM_THREADS. "{threads}" is substituted with the
# run's thread count, so a multithreaded run does not silently keep a
# single-threaded reference (or the reverse). A literal value would pin the
# library regardless of the run, which is what to write for a library that must
# stay sequential.
thread_env = { VECLIB_MAXIMUM_THREADS = "{threads}" }

[isa."aarch64-neon"]
# Advanced SIMD is baseline on arm64; Apple clang targets the host by default,
# so there are no flags to add. EIGEN_BENCH_ISA_TARGET is pinned anyway:
# comparison/CMakeLists.txt otherwise infers the key from the flag string, and
# an inferred key that disagreed with this profile would split the merge config
# in reduce.py for no reason.
flags = []
cmake_options = ["-DEIGEN_BENCH_ISA_TARGET=aarch64-neon"]

[isa."aarch64-sme"]
# Eigen's SME backend is opt-in: EIGEN_ARM64_USE_SME selects it, and without that
# macro the headers compile to the same NEON kernels as the target above, so the
# two ISA targets would differ only in their label. -mcpu=apple-m4 supplies
# FEAT_SME and the optional FEAT_SME_F64F64 that the double-precision GEMM kernel
# needs; TopicVectorization.dox records that double keeps the generic kernel
# without it, which would make an aarch64-sme f64 row a NEON measurement under an
# SME heading.
#
# Deliberately no -msve-vector-bits: ConfigureVectorization.h hard-errors on it
# under EIGEN_ARM64_USE_SME, because a fixed SVE length pins the kernel to one
# streaming vector length and miscomputes at any other.
#
# Only GEMM has an SME kernel today. Every other operation measured under this
# target is the same code as aarch64-neon and should agree with it; where it does
# not, the difference is the run-to-run noise of this machine and is worth
# knowing before any SME number is published.
flags = ["-mcpu=apple-m4", "-DEIGEN_ARM64_USE_SME"]
cmake_options = ["-DEIGEN_BENCH_ISA_TARGET=aarch64-sme"]
