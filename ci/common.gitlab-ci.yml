# Shared rule sets, referenced from concrete jobs via
#   rules: !reference [.rules:<name>, rules]
# Centralizing them keeps the "what triggers this job?" decision in one place.
.rules:libeigen:smoketest:
  # Every merge request, except one that already opted into a wider tier.  The
  # affected tier builds and runs every test the diff can reach on the same
  # native configurations the smoke list samples, and `all-tests` runs the whole
  # suite on all of them; in both cases the fixed list is a subset already being
  # paid for.  The namespace guard matters: neither wider tier has any job
  # outside libeigen, so a fork keeps its smoke coverage whatever it is labelled.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_NAMESPACE == "libeigen" && $CI_MERGE_REQUEST_LABELS =~ "/(affected|all)-tests/"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

.rules:libeigen:all-tests:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_PROJECT_NAMESPACE == "libeigen"
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_PROJECT_NAMESPACE == "libeigen"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_NAMESPACE == "libeigen" && $CI_MERGE_REQUEST_LABELS =~ "/all-tests/"

.rules:libeigen:gpu:
  # Spelled out (rather than referencing .rules:libeigen:all-tests) to avoid
  # a nested !reference, which GitLab CI has had inconsistent support for.
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_PROJECT_NAMESPACE == "libeigen"
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_PROJECT_NAMESPACE == "libeigen"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_NAMESPACE == "libeigen" && $CI_MERGE_REQUEST_LABELS =~ "/all-tests/"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_NAMESPACE == "libeigen" && $CI_MERGE_REQUEST_LABELS =~ "/gpu-tests/"
    # No affected-tier configuration enables CUDA, HIP or SYCL, so the GPU test
    # targets exist in none of them: a diff confined to these paths selects
    # targets every affected build reports as unconfigured and a -R regex that
    # matches nothing, and the tier goes green having compiled and run nothing.
    # These jobs close that gap the way ppc64le closes it for AltiVec.  They
    # ignore the selection and build buildtests_gpu, which covers every GPU
    # test rather than the affected subset.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_NAMESPACE == "libeigen" && $CI_MERGE_REQUEST_LABELS =~ "/affected-tests/"
      changes:
        - Eigen/src/Core/arch/GPU/**/*
        - test/*.cu
        - test/gpu_common.h
        - unsupported/test/*.cu
        - unsupported/test/GPU/**/*
    # `affected-tests` plus `backend::GPU` is the spelling to reach for, because
    # it is the same backend axis every other configuration uses rather than a
    # second mechanism to remember.  The standalone `gpu-tests` entry above
    # stays for the case where GPU coverage is the only thing wanted.
    # `all-platforms` is deliberately absent: it sweeps the CPU configurations,
    # and these jobs hold scarce CUDA-tagged runners to build the whole GPU
    # suite, which is not what "the affected tests, everywhere" should cost.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_NAMESPACE == "libeigen" && $CI_MERGE_REQUEST_LABELS =~ "/affected-tests/" && $CI_MERGE_REQUEST_LABELS =~ "/backend::GPU|backend::CUDA/"

.rules:libeigen:affected-tests:
  # Opt-in middle tier between the fixed smoke list and the full `all-tests`
  # matrix: every test the diff can reach, on a small set of platforms.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_NAMESPACE == "libeigen" && $CI_MERGE_REQUEST_LABELS =~ "/affected-tests/"

# The rest of the affected tier is gated on the platform a job targets as well
# as on the label.  A build job and its paired test job share one rule set: a
# test job whose build did not run has nothing to execute.
#
# Each set has two entries, and GitLab runs the job when either matches:
#
#   changes:  the diff touches the backend, so the platform is selected for the
#             author.  A wider x86 configuration compiles the narrower backends'
#             headers, so an SSE change triggers the AVX and AVX-512 rules too.
#   label:    the platform is asked for outright, whatever the diff contains.
#             This is the axis orthogonal to the include graph: the graph
#             decides *which tests*, the labels decide *where they run*.
#
# The label axis reuses the `backend::*` labels the tracker already carries, so
# marking a merge request as being about a backend and asking for coverage of it
# are the same act.  Two of them did not exist yet (`backend::LSX`,
# `backend::RVV`), Windows is an OS rather than a backend (`platform::windows`),
# and `all-platforms` selects every configuration below at once.  None of this
# has any effect without `affected-tests`.
#
# Each set matches against the whole comma-separated label string independently,
# so several backend labels select the union of their platforms: `backend::NEON`
# with `backend::AltiVec` runs the 32-bit arm and ppc64le jobs, and nothing else
# beyond the four unconditional configurations.
.rules:libeigen:affected-tests:sse:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_NAMESPACE == "libeigen" && $CI_MERGE_REQUEST_LABELS =~ "/affected-tests/"
      changes:
        - Eigen/src/Core/arch/SSE/**/*
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_NAMESPACE == "libeigen" && $CI_MERGE_REQUEST_LABELS =~ "/affected-tests/" && $CI_MERGE_REQUEST_LABELS =~ "/all-platforms|backend::SSE/"

# `backend::AVX` is a prefix of `backend::AVX512`, so this set also matches an
# AVX-512-only label and builds plain AVX that nothing asked for.  Anchoring it
# would need `$` inside the pattern, and a `$` that GitLab took literally rather
# than as end-of-string would silently stop a trailing `backend::AVX` from
# triggering anything -- a coverage hole nobody would see, traded against one
# cheap extra x86-64 build.  The over-approximation is the same direction the
# `changes:` fan-out above already takes.
.rules:libeigen:affected-tests:avx:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_NAMESPACE == "libeigen" && $CI_MERGE_REQUEST_LABELS =~ "/affected-tests/"
      changes:
        - Eigen/src/Core/arch/SSE/**/*
        - Eigen/src/Core/arch/AVX/**/*
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_NAMESPACE == "libeigen" && $CI_MERGE_REQUEST_LABELS =~ "/affected-tests/" && $CI_MERGE_REQUEST_LABELS =~ "/all-platforms|backend::SSE|backend::AVX/"

.rules:libeigen:affected-tests:avx512:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_NAMESPACE == "libeigen" && $CI_MERGE_REQUEST_LABELS =~ "/affected-tests/"
      changes:
        - Eigen/src/Core/arch/SSE/**/*
        - Eigen/src/Core/arch/AVX/**/*
        - Eigen/src/Core/arch/AVX512/**/*
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_NAMESPACE == "libeigen" && $CI_MERGE_REQUEST_LABELS =~ "/affected-tests/" && $CI_MERGE_REQUEST_LABELS =~ "/all-platforms|backend::SSE|backend::AVX/"

# The AVX512-FP16 headers are excluded unless -mavx512fp16 is active, so the
# AVX512DQ build does not parse them.
.rules:libeigen:affected-tests:avx512fp16:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_NAMESPACE == "libeigen" && $CI_MERGE_REQUEST_LABELS =~ "/affected-tests/"
      changes:
        - Eigen/src/Core/arch/AVX512/*FP16*
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_NAMESPACE == "libeigen" && $CI_MERGE_REQUEST_LABELS =~ "/affected-tests/" && $CI_MERGE_REQUEST_LABELS =~ "/all-platforms|backend::AVX512/"

.rules:libeigen:affected-tests:neon:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_NAMESPACE == "libeigen" && $CI_MERGE_REQUEST_LABELS =~ "/affected-tests/"
      changes:
        - Eigen/src/Core/arch/NEON/**/*
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_NAMESPACE == "libeigen" && $CI_MERGE_REQUEST_LABELS =~ "/affected-tests/" && $CI_MERGE_REQUEST_LABELS =~ "/all-platforms|backend::NEON/"

.rules:libeigen:affected-tests:altivec:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_NAMESPACE == "libeigen" && $CI_MERGE_REQUEST_LABELS =~ "/affected-tests/"
      changes:
        - Eigen/src/Core/arch/AltiVec/**/*
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_NAMESPACE == "libeigen" && $CI_MERGE_REQUEST_LABELS =~ "/affected-tests/" && $CI_MERGE_REQUEST_LABELS =~ "/all-platforms|backend::AltiVec/"

.rules:libeigen:affected-tests:lsx:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_NAMESPACE == "libeigen" && $CI_MERGE_REQUEST_LABELS =~ "/affected-tests/"
      changes:
        - Eigen/src/Core/arch/LSX/**/*
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_NAMESPACE == "libeigen" && $CI_MERGE_REQUEST_LABELS =~ "/affected-tests/" && $CI_MERGE_REQUEST_LABELS =~ "/all-platforms|backend::LSX/"

.rules:libeigen:affected-tests:rvv10:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_NAMESPACE == "libeigen" && $CI_MERGE_REQUEST_LABELS =~ "/affected-tests/"
      changes:
        - Eigen/src/Core/arch/RVV10/**/*
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_NAMESPACE == "libeigen" && $CI_MERGE_REQUEST_LABELS =~ "/affected-tests/" && $CI_MERGE_REQUEST_LABELS =~ "/all-platforms|backend::RVV/"

.rules:libeigen:affected-tests:sve-sme:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_NAMESPACE == "libeigen" && $CI_MERGE_REQUEST_LABELS =~ "/affected-tests/"
      changes:
        - Eigen/src/Core/arch/SVE/**/*
        - Eigen/src/Core/arch/SME/**/*
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_NAMESPACE == "libeigen" && $CI_MERGE_REQUEST_LABELS =~ "/affected-tests/" && $CI_MERGE_REQUEST_LABELS =~ "/all-platforms|backend::SVE|backend::SME/"

# Windows has no `changes:` entry.  MSVC diverges from the GCC and Clang jobs on
# whole-library behaviour -- template instantiation limits, `EIGEN_STRONG_INLINE`,
# heap exhaustion in the optimizer -- rather than on any subtree a diff could
# name, so there is nothing to key an automatic trigger on.
.rules:libeigen:affected-tests:windows:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_NAMESPACE == "libeigen" && $CI_MERGE_REQUEST_LABELS =~ "/affected-tests/" && $CI_MERGE_REQUEST_LABELS =~ "/all-platforms|platform::windows/"

.rules:libeigen:scheduled-or-web:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_PROJECT_NAMESPACE == "libeigen"
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_PROJECT_NAMESPACE == "libeigen"

.rules:libeigen:scheduled-or-web:default-branch:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_PROJECT_NAMESPACE == "libeigen" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_PROJECT_NAMESPACE == "libeigen" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.common:linux:cross:
  image: ubuntu:24.04
  variables:
    EIGEN_CI_TARGET_ARCH: ""
    EIGEN_CI_ADDITIONAL_ARGS: ""
    # If host matches target, use the following:
    EIGEN_CI_C_COMPILER: ""
    EIGEN_CI_CXX_COMPILER: ""
    EIGEN_CI_INSTALL: "${EIGEN_CI_C_COMPILER} ${EIGEN_CI_CXX_COMPILER}"
    # If host does not match the target, use the following:
    EIGEN_CI_CROSS_TARGET_TRIPLE: ""
    EIGEN_CI_CROSS_C_COMPILER: ${EIGEN_CI_C_COMPILER}
    EIGEN_CI_CROSS_CXX_COMPILER: ${EIGEN_CI_CXX_COMPILER}
    EIGEN_CI_CROSS_INSTALL: "${EIGEN_CI_CROSS_C_COMPILER} ${EIGEN_CI_CROSS_CXX_COMPILER}"
  before_script:
    # Call script in current shell - it sets up some environment variables.
    - . ci/scripts/common.linux.before_script.sh
  artifacts:
    when: always
    name: "$CI_JOB_NAME_SLUG-$CI_COMMIT_REF_SLUG"
    paths:
      - ${EIGEN_CI_BUILDDIR}/
    exclude:
      - ${EIGEN_CI_BUILDDIR}/**/*.o
      - ${EIGEN_CI_BUILDDIR}/**/*.a
      - ${EIGEN_CI_BUILDDIR}/**/.ninja_log
      - ${EIGEN_CI_BUILDDIR}/**/.ninja_deps
      - ${EIGEN_CI_BUILDDIR}/**/CMakeFiles/*.dir/**
      - ${EIGEN_CI_BUILDDIR}/.cmake/**
      - ${EIGEN_CI_BUILDDIR}/**/Testing/Temporary/**
    expire_in: 2 days

# Base configuration for Windows builds and tests.
.common:windows:
  variables:
    EIGEN_CI_MSVC_ARCH: x64
    EIGEN_CI_MSVC_VER: "14.29"
    EIGEN_CI_ADDITIONAL_ARGS: ""
    EIGEN_CI_BEFORE_SCRIPT: ""
  before_script:
     - . ci/scripts/common.windows.before_script.ps1
  artifacts:
    when: always
    name: "$CI_JOB_NAME_SLUG-$CI_COMMIT_REF_NAME"
    paths:
      - ${EIGEN_CI_BUILDDIR}/
    exclude:
      - ${EIGEN_CI_BUILDDIR}/**/*.obj
      - ${EIGEN_CI_BUILDDIR}/**/*.lib
      - ${EIGEN_CI_BUILDDIR}/**/.ninja_log
      - ${EIGEN_CI_BUILDDIR}/**/.ninja_deps
      - ${EIGEN_CI_BUILDDIR}/**/CMakeFiles/*.dir/**
      - ${EIGEN_CI_BUILDDIR}/.cmake/**
      - ${EIGEN_CI_BUILDDIR}/**/Testing/Temporary/**
    expire_in: 2 days
