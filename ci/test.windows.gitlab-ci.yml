.test:windows:
  extends: .common:windows
  stage: test
  script:
    - ./ci/scripts/test.windows.script.ps1
  after_script:
    - ./ci/scripts/test.windows.after_script.ps1
  rules: !reference [.rules:libeigen:all-tests, rules]
  tags:
    - eigen-runner
    - windows
    - x86-64
  allow_failure:
    exit_codes: 42

##### MSVC #####################################################################

# MSVC 14.29 (VS 2019) 64 bit

.test:windows:x86-64:msvc-14.29:default:
  extends: .test:windows
  needs: [ build:windows:x86-64:msvc-14.29:default ]

test:windows:x86-64:msvc-14.29:default:official:
  extends: .test:windows:x86-64:msvc-14.29:default
  variables:
    EIGEN_CI_CTEST_LABEL: Official

test:windows:x86-64:msvc-14.29:default:unsupported:
  extends: .test:windows:x86-64:msvc-14.29:default
  variables:
    EIGEN_CI_CTEST_LABEL: Unsupported

.test:windows:x86-64:msvc-14.29:avx2:
  extends: .test:windows
  needs: [ build:windows:x86-64:msvc-14.29:avx2 ]

test:windows:x86-64:msvc-14.29:avx2:official:
  extends: .test:windows:x86-64:msvc-14.29:avx2
  variables:
    EIGEN_CI_CTEST_LABEL: Official

test:windows:x86-64:msvc-14.29:avx2:unsupported:
  extends: .test:windows:x86-64:msvc-14.29:avx2
  variables:
    EIGEN_CI_CTEST_LABEL: Unsupported

.test:windows:x86-64:msvc-14.29:avx512dq:
  extends: .test:windows
  needs: [ build:windows:x86-64:msvc-14.29:avx512dq ]
  tags:
    - eigen-runner
    - windows
    - x86-64
    - avx512

test:windows:x86-64:msvc-14.29:avx512dq:official:
  extends: .test:windows:x86-64:msvc-14.29:avx512dq
  variables:
    EIGEN_CI_CTEST_LABEL: Official

test:windows:x86-64:msvc-14.29:avx512dq:unsupported:
  extends: .test:windows:x86-64:msvc-14.29:avx512dq
  variables:
    EIGEN_CI_CTEST_LABEL: Unsupported

# MSVC 14.29 (VS 2019) + CUDA

.test:windows:cuda:
  extends: .test:windows
  allow_failure: true
  variables:
    EIGEN_CI_CTEST_LABEL: gpu
  rules: !reference [.rules:libeigen:gpu, rules]
  tags:
    - eigen-runner
    - windows
    - x86-64
    - cuda

# MSVC 14.29 + CUDA 12.2
test:windows:x86-64:cuda-12.2:msvc-14.29:
  extends: .test:windows:cuda
  needs: [ build:windows:x86-64:cuda-12.2:msvc-14.29 ]

##### MSVC cross-compiled on Linux #############################################
# Runs the binaries cross-compiled by build:windows:cross:... on a hosted
# Windows runner.  Test-only: hosted Windows runners have no Docker executor,
# and the toolchain lives on the Linux builder.

test:windows:cross:x86-64:msvc-14.29:smoketest:
  extends: .common:windows
  stage: test
  needs: [ build:windows:cross:x86-64:msvc-14.29:smoketest ]
  variables:
    EIGEN_CI_CTEST_LABEL: smoketest
  before_script:
    - . ci/scripts/common.windows.before_script.ps1
    # The build tree was configured on Linux; repoint its CTest files here.
    - ./ci/scripts/test.windows-cross.before_script.ps1
  script:
    - ./ci/scripts/test.windows.script.ps1
  after_script:
    - ./ci/scripts/test.windows.after_script.ps1
  tags:
    - saas-windows-medium-amd64
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  allow_failure:
    exit_codes: 42
