# ---------------------------------------------------------------------------
# Operations
# ---------------------------------------------------------------------------
# Keyed by the BLAS/LAPACK mnemonic with the type prefix stripped, uppercase,
# matching ^[A-Z][A-Z0-9_]*$. The key is the first field of every benchmark name
# it produces. An operation that specialises a mnemonic (a transpose variant,
# say) uses an underscore-suffixed key such as GEMM_TN and sets `base_mnemonic`
# and `variant` so renderers can group it under the parent.
#
# `status` is one of:
#   implemented  - a benchmark source registers both arms and the harness runs it
#   planned      - registered here, no benchmark source yet; renders as "not measured"
#
# `reference.kind` is one of:
#   blas | lapack   - a reference routine exists; `routine` names it with '?' for
#                     the type prefix, so ?gemm resolves to sgemm/dgemm/cgemm/zgemm
#   none            - no reference equivalent exists. `reason` is REQUIRED and is
#                     rendered verbatim in the reference column so a table says
#                     why the comparison cannot exist rather than leaving a blank
#                     that reads as a missing measurement.
#
# `flops.real` is a formula over the family's dimension names, evaluated by the
# reducer with a restricted arithmetic evaluator (see CONTRACTS.md section 5).
# The scalar flop count is `flops.real * scalars.<tag>.flop_scale / 2`, i.e. the
# formula already includes the real multiply-add factor of 2 so that GEMM reads
# as the familiar 2*m*n*k. `flops.nominal = true` marks a count that is a
# convention rather than a hardware-truthful operation count; it is still
# identical for both arms, so the ratio is meaningful even where the absolute
# GFLOP/s is not a machine-efficiency figure.

[ops.GEMM]
display_name = "GEMM"
long_name = "General matrix-matrix product"
family = "blas3"
description = "C := alpha*A*B + beta*C for general dense A (m-by-k) and B (k-by-n). The workhorse of dense linear algebra and the operation most vendor libraries tune hardest."
eigen_expr = "C.noalias() += A * B"
eigen_class = ""
eigen_doc = "Eigen::MatrixBase::operator*"
shape_family = "square3"
scalars = ["f32", "f64", "c32", "c64"]
status = "implemented"
source = "benchmarks/comparison/bench_gemm_compare.cpp"

[ops.GEMM.reference]
kind = "blas"
routine = "?gemm"
cblas = "cblas_?gemm"
level = 3

[ops.GEMM.flops]
real = "2*m*n*k"
nominal = false
helper = "eigen_bench::gemmFlops<Scalar>(m, n, k)"

[ops.GEMV]
display_name = "GEMV"
long_name = "General matrix-vector product"
family = "blas2"
description = """
y := alpha*op(A)*x + beta*y for general dense A. Registered as trans='N' with
alpha = beta = 1; the transposed form is a different reference call and would get
its own GEMV_T key rather than a runtime branch.

Above L2 this is a bandwidth measurement wearing a flop rate: 2*m*n is the honest
operation count, but the achievable figure is set by how fast A can be streamed,
not by the FMA units, so it sits far below peak for every implementation. The
count is identical for both arms, so the ratio is sound; the absolute number is
not a machine-efficiency figure and must not be read against a GEMM one. The
tall_skinny and short_fat groups are both measured because the two aspect ratios
take different paths through Eigen/src/Core/products/GeneralMatrixVector.h.
"""
eigen_expr = "y.noalias() += A * x"
eigen_class = ""
eigen_doc = "Eigen::MatrixBase::operator*"
shape_family = "matvec2"
scalars = ["f32", "f64", "c32", "c64"]
status = "implemented"
source = "benchmarks/comparison/bench_gemv_compare.cpp"

[ops.GEMV.reference]
kind = "blas"
routine = "?gemv"
cblas = "cblas_?gemv"
level = 2

[ops.GEMV.flops]
real = "2*m*n"
nominal = false
helper = "eigen_bench::gemvFlops<Scalar>(m, n)"

[ops.TRSM]
display_name = "TRSM"
long_name = "Triangular solve with multiple right-hand sides"
family = "blas3"
description = "B := alpha*op(A)^-1 * B with A triangular n-by-n and B n-by-nrhs. Registered as side='L', uplo='L', trans='N', diag='N'; other combinations get their own variant keys."
eigen_expr = "A.triangularView<Eigen::Lower>().solveInPlace(B)"
eigen_class = "Eigen::TriangularView"
eigen_doc = "Eigen::TriangularView::solveInPlace"
shape_family = "solve2"
scalars = ["f32", "f64", "c32", "c64"]
status = "planned"
base_mnemonic = "TRSM"
variant = "LLNN"

[ops.TRSM.reference]
kind = "blas"
routine = "?trsm"
cblas = "cblas_?trsm"
level = 3

[ops.TRSM.flops]
real = "n*n*nrhs"
nominal = false
helper = "eigen_bench::trsmFlops<Scalar>(n, nrhs)"

[ops.POTRF]
display_name = "POTRF"
long_name = "Cholesky factorization"
family = "lapack-factorization"
description = """
A = L*L^T (or U^H*U) for symmetric/Hermitian positive definite A. Eigen's LLT is
the direct counterpart, and the Eigen arm is timed as the expression above --
which is not quite only the factorization. LLT::compute additionally evaluates
the operand's self-adjoint L1 norm, the quantity that makes LLT::rcond()
available afterwards; ?potrf computes no norm, and a LAPACK user who wants rcond
calls ?lange before ?pocon. The norm is O(n^2) against the factorization's
O(n^3/3), so its share of the Eigen arm falls with n and matters most at the
small end. Read this row as "what the Eigen spelling costs against ?potrf", not
as a kernel-for-kernel ratio.
"""
eigen_expr = "Eigen::LLT<MatrixType> llt(A)"
eigen_class = "Eigen::LLT"
eigen_doc = "Eigen::LLT"
shape_family = "square1"
scalars = ["f32", "f64", "c32", "c64"]
status = "implemented"
source = "benchmarks/comparison/bench_potrf_compare.cpp"

[ops.POTRF.reference]
kind = "lapack"
routine = "?potrf"
level = 3

[ops.POTRF.flops]
# Closed form of the summation loop already used by benchmarks/Cholesky/bench_cholesky.cpp
# and benchmarks/Cholesky/bench_bunchkaufman.cpp:
#   sum_{j=0}^{n-1} 2*((n-1-j)*j + (n-1-j) + j)
# It agrees with the textbook n^3/3 asymptotically and reproduces the existing
# reported numbers exactly, so adopting the shared helper changes no published value.
real = "n*(n-1)*(n-2)/3 + 2*n*(n-1)"
nominal = false
helper = "eigen_bench::symmetricFactorizationFlops<Scalar>(n)"

[ops.GETRF]
display_name = "GETRF"
long_name = "LU factorization with partial pivoting"
family = "lapack-factorization"
description = "P*A = L*U for general m-by-n A. Eigen's PartialPivLU is the counterpart for the square case; the rectangular case exercises the panel factorization."
eigen_expr = "Eigen::PartialPivLU<MatrixType> lu(A)"
eigen_class = "Eigen::PartialPivLU"
eigen_doc = "Eigen::PartialPivLU"
shape_family = "general2"
scalars = ["f32", "f64", "c32", "c64"]
status = "planned"

[ops.GETRF.reference]
kind = "lapack"
routine = "?getrf"
level = 3

[ops.GETRF.flops]
real = "m*n*n - n*n*n/3"
nominal = false
helper = "eigen_bench::getrfFlops<Scalar>(m, n)"

[ops.GEQRF]
display_name = "GEQRF"
long_name = "Householder QR factorization"
family = "lapack-factorization"
description = "A = Q*R by Householder reflections, Q left in factored form. Eigen's HouseholderQR is the counterpart."
eigen_expr = "Eigen::HouseholderQR<MatrixType> qr(A)"
eigen_class = "Eigen::HouseholderQR"
eigen_doc = "Eigen::HouseholderQR"
shape_family = "general2"
scalars = ["f32", "f64", "c32", "c64"]
status = "planned"

[ops.GEQRF.reference]
kind = "lapack"
routine = "?geqrf"
level = 3

[ops.GEQRF.flops]
real = "2*m*n*n - 2*n*n*n/3"
nominal = false
helper = "eigen_bench::geqrfFlops<Scalar>(m, n)"

[ops.GESDD]
display_name = "GESDD"
long_name = "Singular value decomposition, divide and conquer"
family = "lapack-svd"
description = "Thin SVD A = U*S*V^H by bidiagonalization plus a divide-and-conquer bidiagonal solve. Eigen's BDCSVD is the direct algorithmic counterpart; both are registered with thin U and V computed."
eigen_expr = "Eigen::BDCSVD<MatrixType> svd(A, Eigen::ComputeThinU | Eigen::ComputeThinV)"
eigen_class = "Eigen::BDCSVD"
eigen_doc = "Eigen::BDCSVD"
shape_family = "general2"
scalars = ["f32", "f64", "c32", "c64"]
status = "planned"

[ops.GESDD.reference]
kind = "lapack"
routine = "?gesdd"
level = 3

[ops.GESDD.flops]
# Conventional R-bidiagonalization count for thin U and V (Golub & Van Loan,
# 4th ed., section 8.6). The divide-and-conquer bidiagonal stage is data
# dependent, so no formula is exact; this one is applied identically to both
# arms, which is what makes the ratio defensible.
real = "8*m*n*n + 4*n*n*n/3"
nominal = true
helper = "eigen_bench::gesddFlops<Scalar>(m, n)"

[ops.SYEV]
display_name = "SYEV"
long_name = "Symmetric/Hermitian eigendecomposition"
family = "lapack-eigen"
description = "Full eigendecomposition of a symmetric/Hermitian n-by-n matrix with eigenvectors. Eigen's SelfAdjointEigenSolver is the counterpart. HEEV is the same operation for the complex scalar variants and is not a separate key."
eigen_expr = "Eigen::SelfAdjointEigenSolver<MatrixType> es(A)"
eigen_class = "Eigen::SelfAdjointEigenSolver"
eigen_doc = "Eigen::SelfAdjointEigenSolver"
shape_family = "square1"
scalars = ["f32", "f64", "c32", "c64"]
status = "planned"

[ops.SYEV.reference]
kind = "lapack"
routine = "?syev"
complex_routine = "?heev"
level = 3

[ops.SYEV.flops]
# Tridiagonal reduction (4/3 n^3) plus accumulation of the orthogonal factor
# and the QR iteration; the iteration count is data dependent.
real = "9*n*n*n"
nominal = true
helper = "eigen_bench::syevFlops<Scalar>(n)"

[ops.FULLPIVLU]
display_name = "FullPivLU"
long_name = "LU factorization with complete pivoting"
family = "eigen-only"
description = "Rank-revealing LU with full pivoting. LAPACK has no supported driver for this factorization, so the Eigen arm is reported alone."
eigen_expr = "Eigen::FullPivLU<MatrixType> lu(A)"
eigen_class = "Eigen::FullPivLU"
eigen_doc = "Eigen::FullPivLU"
shape_family = "general2"
scalars = ["f32", "f64", "c32", "c64"]
status = "planned"

[ops.FULLPIVLU.reference]
kind = "none"
reason = "No LAPACK driver: complete-pivoting LU (the deprecated ?gefa family aside) has no supported netlib equivalent."

[ops.FULLPIVLU.flops]
# The LU count, matching the named helper. Complete pivoting adds an O(n^3)
# search that the count deliberately ignores, which is what makes it nominal; it
# is not the QR count, and charging one arm twice what its own helper computes
# would put two flop figures that disagree by 2x into the same measurement row.
real = "m*n*n - n*n*n/3"
nominal = true
helper = "eigen_bench::getrfFlops<Scalar>(m, n)"

[ops.RANDCOD]
display_name = "RandCOD"
long_name = "Randomized complete orthogonal decomposition"
family = "eigen-only"
description = "Randomized rank-revealing complete orthogonal decomposition. There is no LAPACK counterpart; ?geqp3 solves a related but different problem and is registered under its own key."
eigen_expr = "Eigen::RandCOD<MatrixType> cod(A)"
eigen_class = "Eigen::RandCOD"
eigen_doc = "Eigen::RandCOD"
shape_family = "general2"
scalars = ["f32", "f64", "c32", "c64"]
status = "planned"

[ops.RANDCOD.reference]
kind = "none"
reason = "No LAPACK equivalent: randomized rank-revealing factorizations are not part of the netlib API surface."

[ops.RANDCOD.flops]
real = "2*m*n*n - 2*n*n*n/3"
nominal = true
helper = "eigen_bench::geqrfFlops<Scalar>(m, n)"
